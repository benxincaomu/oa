spring:
  application:
    name: oa

  datasource:
    url: @db.url@
    password: @db.password@
    username: @db.username@
    driver-class-name: org.postgresql.Driver
    hikari:
      connectionTimeout: 10000
      idle-timeout: 30000
      minimum-idle: 4
      maximum-pool-size: 10
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true
          return-first-only: false
        enhancer:
          enableLazyInitialization: true
          enableAssociationManagement: true
          enableDirtyTracking: true

  data:
    redis:
      host: @redis.host@
      port: @redis.port@
      password: @redis.password@
      database: @redis.database@
      repositories:
        enabled: false

  jackson:
    default-property-inclusion: NON_NULL

  threads:
    virtual:
      enabled: true

  mail:
    host: @mail.host@
    port: @mail.port@
    username: @mail.username@
    password: @mail.password@
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
            checkserveridentity: false

logging:
  level:
    root: info
    com.zaxxer.hikari.pool: info
    org.camunda.bpm.engine: info
    javax.management: info
    sun.rmi: info
    org.postgresql.jdbc: info
    org.springframework.orm: info
    org.springframework.data: info
    io.lettuce: info
    org.springframework.security.web: info
  logback:
    rollingpolicy:
      max-file-size: 100Mb
  file:
    name: ${LOG_PATH:/var/logs/oa/oa.log}
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss,Asia/Shanghai,zh-CN
    file: "%date{yyyy-MM-dd HH:mm:ss.SSS,Asia/Shanghai,zh-CN} %-5level [%-15.15(%thread)] %-50.50(%logger{50}) : %msg%n"

management:
  endpoints:
    web:
      exposure:
        include:
         - beans

app:
  base-url: @app.base-url@
  data-table-nums: 5
  # Keycloak 连接配置来自配置文件/环境变量，不再写入数据库。
  # 直接在本文件填写即可；也可以保留环境变量覆盖，生产环境推荐用环境变量避免把密钥提交到仓库。
  #
  # 本地开发示例（把下面 6 个值替换成 Keycloak 控制台中的实际值）：
  #   issuer-uri: http://10.0.0.102:8080/realms/oa
  #   realm: oa
  #   client-id: oa-web
  #   service-account-client-id: oa-service
  #   client-secret: <oa-web 客户端密钥>
  #   service-account-client-secret: <oa-service 客户端密钥>
  #
  # 说明：
  #   client-id/client-secret           —— 浏览器 OIDC 登录使用的 confidential client
  #   service-account-client-id/secret  —— Admin REST（用户/组/角色/授权资源）使用的服务账号客户端
  #   redirect-uri                      —— 前端地址 + /server/login/oauth2/code/keycloak
  #   post-logout-redirect-uri          —— 退出登录后回到的前端页面
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    realm: ${KEYCLOAK_REALM:}
    client-id: ${KEYCLOAK_CLIENT_ID:}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    service-account-client-id: ${KEYCLOAK_SERVICE_ACCOUNT_CLIENT_ID:}
    service-account-client-secret: ${KEYCLOAK_SERVICE_ACCOUNT_CLIENT_SECRET:}
    redirect-uri: ${KEYCLOAK_REDIRECT_URI:http://10.0.0.130:4000/server/login/oauth2/code/keycloak}
    post-logout-redirect-uri: ${KEYCLOAK_POST_LOGOUT_REDIRECT_URI:http://10.0.0.130:4000/app}

camunda:
  bpm:
    generic-properties:
      properties:
        enforceHistoryTimeToLive: false

server:
  port: @server.port@
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  tomcat:
    threads:
      max: 50

minio:
  access-key: @minio.access-key@
  secret-key: @minio.secret-key@
  endpoint: @minio.endpoint@
  bucket-name: @minio.bucket-name@
  static-url: @minio.static-url@
